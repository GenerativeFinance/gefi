{%- comment -%}
  Request-a-demo form. Wired to site.api.demo_endpoint via assets/js/forms.js
  (data-form="demo"). While the endpoint is empty the JS shows a simulated
  "thanks" message — see _includes/newsletter.html for the same pattern.
{%- endcomment -%}
<noscript>
  <p class="lead">
    JavaScript is required to submit this form. Email
    <a href="mailto:sales@gefi.io?subject=Demo%20request">sales@gefi.io</a>
    and we'll book time within one business day.
  </p>
</noscript>

<form class="form-grid" data-form="demo">
  <label>
    Name
    <input type="text" name="name" autocomplete="name" required />
  </label>
  <label>
    Work email
    <input type="email" name="email" autocomplete="email" required />
  </label>
  <label>
    Company
    <input type="text" name="company" autocomplete="organization" required />
  </label>
  <label>
    Role
    <select name="role">
      <option value="portfolio-manager">Portfolio manager / trader</option>
      <option value="quant">Quant / data scientist</option>
      <option value="risk">Risk / compliance</option>
      <option value="engineering">Engineering / platform</option>
      <option value="product">Product / strategy</option>
      <option value="other">Other</option>
    </select>
  </label>
  <label>
    Team size
    <select name="team_size">
      <option value="1">Just me</option>
      <option value="2-10">2–10</option>
      <option value="11-50">11–50</option>
      <option value="51-250">51–250</option>
      <option value="250+">250+</option>
    </select>
  </label>
  <label>
    What would you like to see?
    <textarea name="message" rows="5" placeholder="Specific models, jurisdictions, integrations…"></textarea>
  </label>
  <button type="submit" class="btn btn-primary">Request demo</button>
  <p class="newsletter__status" data-status role="status" aria-live="polite"></p>
</form>
