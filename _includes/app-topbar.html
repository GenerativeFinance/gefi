{%- assign nav = site.data.app_nav[include.persona] -%}
<header class="app-topbar">
  <a class="app-topbar__brand" href="/app/" aria-label="GeFi app home">
    <span class="app-topbar__logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3.5 3.5 0 0 0-3.5 3.5v.2A3 3 0 0 0 4 9.5a3 3 0 0 0 1 2.24A3.5 3.5 0 0 0 6.5 18h.5"/><path d="M14.5 3A3.5 3.5 0 0 1 18 6.5v.2A3 3 0 0 1 20 9.5a3 3 0 0 1-1 2.24A3.5 3.5 0 0 1 17.5 18H17"/><path d="M9.5 3a2.5 2.5 0 0 1 5 0v14a2.5 2.5 0 0 1-5 0z"/></svg>
    </span>
    <span class="app-topbar__word">GeFi</span>
  </a>
  <div class="app-topbar__spacer"></div>
  <span class="app-iconbtn" title="{{ include.persona | capitalize }} workspace" aria-hidden="true">
    {%- case nav.icon -%}
    {%- when "code" -%}
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
    {%- when "shield" -%}
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V5z"/></svg>
    {%- else -%}
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
    {%- endcase -%}
  </span>
  <button type="button" class="app-iconbtn" aria-label="Search" data-app-search>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button type="button" class="app-iconbtn app-iconbtn--bell" aria-label="Notifications" data-app-bell>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="app-iconbtn__dot" data-app-bell-dot></span>
  </button>
  <button type="button" class="app-iconbtn" aria-label="Toggle theme" data-app-theme>
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button type="button" class="app-iconbtn app-iconbtn--lang" aria-label="Language">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    <span>Language</span>
  </button>
  <span class="app-avatar" aria-label="Account">JL</span>
</header>
