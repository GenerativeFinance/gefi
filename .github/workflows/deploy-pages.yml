name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege defaults for every job; pages + id-token granted only to the
# deploy job that actually needs them.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.207.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5.0.0

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --baseurl "${{ steps.pages.outputs.base_path }}" \
            --destination ./_site

      - name: Verify build outputs
        run: |
          test -f ./_site/index.html
          test -f ./_site/sitemap.xml
          test -f ./_site/feed.xml
          test -f ./_site/CNAME
          # Smoke-check: sitemap must reference the apex domain.
          grep -q "https://gefi.io" ./_site/sitemap.xml

      - name: HTML link & markup audit
        run: |
          gem install --no-document html-proofer -v 5.0.9
          # Ignore external links (they go to as-yet-unbuilt subdomains).
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
            --ignore-status-codes "0,999"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
