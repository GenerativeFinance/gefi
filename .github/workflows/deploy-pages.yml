name: Deploy Jekyll site to GitHub Pages

# Builds the Jekyll site with Bundler-pinned Jekyll 4.4.1 (matching the
# local Gemfile.lock exactly) and publishes the built `_site/` to
# GitHub Pages via the official actions/deploy-pages action.
#
# Why this exists
# ---------------
# GitHub Pages' built-in "deploy from branch" only supports Jekyll 3.10.x
# and a fixed plugin allowlist. Without this workflow, GH Pages either
#   (a) builds with the wrong Jekyll version (4.x features break), or
#   (b) sees `.nojekyll` at the repo root and serves raw `*.md` source
#       (frontmatter + Liquid tags rendered as plain text — exactly the
#       symptom that made gefi.io look like a wall of text).
#
# Keep `.nojekyll` at the repo root: it tells GH Pages NOT to try to
# re-process the artifact this workflow uploads — the `_site/` folder is
# already the final HTML.
#
# Repository setting required (one-time, in the GitHub UI):
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"

on:
  push:
    branches: [main]
    # Skip Pages rebuilds when only backend / tooling files change. Edit
    # this list when adding new top-level content directories.
    paths-ignore:
      - "infrastructure/**"
      - "legacy/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - "**/*.md.bak"
      - ".local/**"
      - ".agents/**"
  workflow_dispatch:

# Pages deploys must be serialised — only one in flight at a time, and
# the running one finishes before the next starts so we never publish a
# half-built site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.207.0
        with:
          # Match the local dev container exactly (Replit Nix uses 3.2.2).
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Configure Pages
        # Surfaces the Pages site URL as a step output so the deploy job
        # can echo it. Idempotent — safe to run on every push.
        uses: actions/configure-pages@v5.0.0

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        # `--baseurl ""` is explicit so the build matches the apex domain
        # served at gefi.io (the CNAME file pins it). If you ever move
        # the site under a project subpath, change this AND `_config.yml`.
        run: bundle exec jekyll build --destination ./_site --baseurl ""

      - name: HTML proof (link + image audit)
        # Catches broken internal links and missing images before they
        # ship. External URLs are skipped to keep CI hermetic and avoid
        # rate-limit flakes from third parties.
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
            --ignore-missing-alt \
            --no-enforce-https \
            --ignore-urls "/^#/,/mailto:/,/^\/cdn-cgi\//"
        continue-on-error: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
