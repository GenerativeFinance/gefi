title: GeFi
tagline: AI financial models — federated, audited, accountable.
description: >-
  GeFi is the marketplace for AI financial models. Discover, subscribe to, and
  contribute to federated, audit-ready models for investing, risk, fraud,
  compliance, and trade finance.
url: "https://gefi.io"
baseurl: ""

author:
  name: GeFi
  email: hello@gefi.io
  twitter: gefi_io

logo: /assets/img/logo.svg
og_image: /assets/img/og-default.png
twitter_handle: "@gefi_io"

# Backend wiring.
#
# Forms POST JSON to these endpoints. While they are empty strings, the
# client falls back to a "thanks, we'll be in touch" simulated success path
# (see assets/js/forms.js). Once Task #2 (Cloudflare backend) ships, fill in
# the URLs:
#   newsletter_endpoint: "https://api.gefi.io/v1/newsletter/subscribe"
#   contact_endpoint:    "https://api.gefi.io/v1/contact"
#   demo_endpoint:       "https://api.gefi.io/v1/demo"
api:
  base_url: ""
  newsletter_endpoint: ""
  contact_endpoint: ""
  demo_endpoint: ""

# App surface (app.gefi.io).
#
# `enabled: false` routes every "Sign in" / "Get started" / "Subscribe" CTA
# to the contact page so we don't ship dead links. Flip to `true` once Task #7
# (the dashboards) is live.
app:
  enabled: false
  signin_url: "https://app.gefi.io/sign-in"
  signup_url: "https://app.gefi.io/sign-up"
  fallback_url: "/contact/?topic=sales"

# Auth0 wiring for the onboarding flow + dashboard sign-in.
#
# Filled in for prod by the operator following AUTH0-SETUP.md (see
# infrastructure/cloudflare/AUTH0-SETUP.md). The values below are the
# *staging* defaults; production is set via Jekyll's --config override
# on deploy.
auth0:
  domain: "https://gefi-staging.eu.auth0.com/"
  client_id: ""             # SPA client id from Auth0
  audience: "https://staging-api.gefi.io"
  callback_path: "/auth/callback"
  scope: "openid profile email offline_access"

nav:
  - { title: "Models",     url: "/models/" }
  - { title: "Features",   url: "/features/" }
  - { title: "Pricing",    url: "/pricing/" }
  - { title: "Research",   url: "/research/" }
  - { title: "Docs",       url: "/docs/" }
  - { title: "Blog",       url: "/blog/" }

footer_nav:
  product:
    - { title: "Models",     url: "/models/" }
    - { title: "Features",   url: "/features/" }
    - { title: "Pricing",    url: "/pricing/" }
    - { title: "Research",   url: "/research/" }
    - { title: "Docs",       url: "/docs/" }
    - { title: "Request demo", url: "/demo/" }
  company:
    - { title: "About",        url: "/about/" }
    - { title: "Partnerships", url: "/partnerships/" }
    - { title: "Blog",         url: "/blog/" }
    - { title: "Contact",      url: "/contact/" }
  trust:
    - { title: "Compliance & Trust", url: "/compliance/" }
    - { title: "Status",             url: "https://status.gefi.io" }
    - { title: "Privacy",            url: "/legal/privacy/" }
    - { title: "Terms",              url: "/legal/terms/" }
    - { title: "Cookie Policy",      url: "/cookie-policy/" }
    - { title: "DPA",                url: "/dpa/" }
  legal:
    - { title: "Privacy",       url: "/legal/privacy/" }
    - { title: "Terms",         url: "/legal/terms/" }
    - { title: "Cookie Policy", url: "/cookie-policy/" }
    - { title: "DPA",           url: "/dpa/" }
  contacts:
    - { label: "General",  email: "hello@gefi.io" }
    - { label: "Sales",    email: "sales@gefi.io" }
    - { label: "Legal",    email: "legal@gefi.io" }
    - { label: "Privacy",  email: "privacy@gefi.io" }
    - { label: "Security", email: "security@gefi.io" }

# Social / community channels surfaced in the footer "Connect" column.
# Update the placeholder URLs (discord, linkedin) once the operator has
# the real invite / company page links.
social:
  - { name: "X",        handle: "@GeeFiOfficial",   url: "https://x.com/GeeFiOfficial",  icon: "twitter" }
  - { name: "GitHub",   handle: "gefi-io",          url: "https://github.com/gefi-io",   icon: "github" }
  - { name: "Discord",  handle: "Join the server", url: "#discord",                      icon: "discord" }
  - { name: "LinkedIn", handle: "GeFi",             url: "#linkedin",                    icon: "linkedin" }

# Pricing page (Task #3).
#
# `show_pro_price: true` renders Pro as "From $X/mo" using `pro_price`.
# Flip to `false` to render "Contact us" instead (e.g. during early access
# while we tune the meter).
pricing:
  show_pro_price: true
  pro_price: "From $499/mo"
  pro_price_yearly: "From $4,990/yr"
  pro_price_note_yearly: "/ year"
  pro_price_contact: "Contact us"
  # Billing toggle (Task #7).
  # `billing_default` controls which option is selected on first visit
  # (sessionStorage overrides per visitor after that).
  show_billing_toggle: true
  billing_default: "monthly"
  billing_monthly_label: "Monthly"
  billing_yearly_label: "Yearly"
  yearly_discount_label: "Save ~17% (2 months free)"
  payment_methods_note: >-
    Subscriptions can be paid by card, ACH, or wallet (USDC on Base, Arbitrum,
    and Optimism). Developer payouts can be in fiat or USDC.
  tax_note: "Invoices include VAT/GST registration numbers per jurisdiction."

plans:
  - id: free
    name: Free
    price: "$0"
    price_note: "/ month"
    summary: "For evaluation, research, and tinkering."
    features:
      - "100 inference calls / day"
      - "1 API key"
      - "Dashboard access"
      - "Playground sandbox"
      - "Community support"
    highlighted: false
    cta_label: "Start for free"
    cta_tier: "free"
  - id: pro
    name: Pro
    price: ""        # Resolved at render time from site.pricing
    price_note: ""
    summary: "For teams running production strategies."
    features:
      - "Unlimited inference calls (metered)"
      - "10 API keys"
      - "Federated participation"
      - "Live risk surface (VaR / stress)"
      - "Priority support"
      - "Stripe + onchain payment (USDC on Base, Arbitrum, Optimism)"
      - "MFA enforced"
    highlighted: true
    badge: "Most popular"
    cta_label: "Start Pro trial"
    cta_tier: "pro"
  - id: enterprise
    name: "Enterprise / Sovereign"
    price: "Custom"
    price_note: ""
    summary: "For sovereign tenants and regulated institutions."
    features:
      - "Everything in Pro"
      - "Sovereign data plane (OVH SecNumCloud, Infomaniak, AWS Bahrain, AWS GovCloud)"
      - "Per-jurisdiction counsel directory"
      - "Custom SLA"
      - "Named CSM"
      - "Onchain payouts"
      - "Audit evidence packs"
    highlighted: false
    cta_label: "Talk to us"
    cta_tier: "enterprise"

# Detailed plan comparison matrix rendered beneath the pricing cards
# (Task #8). Editable here so marketing can tweak the matrix without
# touching HTML. `plan_ids` controls column order and must reference
# entries in the `plans:` list above (we look up the display name from
# there). Values are plain strings — use "—" for "not included".
plan_comparison:
  plan_ids: [free, pro, enterprise]
  groups:
    - title: "Limits"
      rows:
        - { label: "Inference calls",          values: ["100 / day",      "Unlimited (metered)", "Unlimited (metered)"] }
        - { label: "API keys",                 values: ["1",              "10",                  "Unlimited"] }
        - { label: "Concurrent requests",      values: ["2",              "50",                  "Custom"] }
        - { label: "Bulk / streaming mode",    values: ["—",              "Included",            "Included"] }
        - { label: "Federated participation",  values: ["—",              "Included",            "Included"] }
    - title: "Support"
      rows:
        - { label: "Channel",                  values: ["Community",      "Email + chat",        "Named CSM + Slack Connect"] }
        - { label: "First-response SLA",       values: ["Best effort",    "Next business day",   "1 hour (24×7, P1)"] }
        - { label: "Uptime SLA",               values: ["—",              "99.9%",               "99.95% (custom available)"] }
        - { label: "Onboarding",               values: ["Self-serve",     "Guided checklist",    "White-glove migration"] }
    - title: "Compliance"
      rows:
        - { label: "Sovereign data plane",     values: ["—",              "EU multi-tenant",     "OVH SecNumCloud, Infomaniak, AWS Bahrain, AWS GovCloud"] }
        - { label: "Data residency choice",    values: ["EU default",     "EU / US",             "Per-jurisdiction pinning"] }
        - { label: "Audit evidence packs",     values: ["—",              "Quarterly",           "On demand + per-request"] }
        - { label: "Per-jurisdiction counsel", values: ["—",              "—",                   "Included directory"] }
        - { label: "DPA + sub-processor list", values: ["Standard DPA",   "Standard DPA",        "Negotiated DPA"] }
    - title: "Payments"
      rows:
        - { label: "Card / ACH (Stripe)",      values: ["—",              "Included",            "Included"] }
        - { label: "Onchain pay-in (USDC)",    values: ["—",              "Base, Arbitrum, Optimism", "Base, Arbitrum, Optimism"] }
        - { label: "Developer payouts",        values: ["—",              "Fiat",                "Fiat or onchain (USDC)"] }
        - { label: "Stripe Tax / VAT invoices",values: ["—",              "Included",            "Included"] }
        - { label: "Custom invoicing & PO",    values: ["—",              "—",                   "Included"] }
    - title: "Security"
      rows:
        - { label: "MFA",                      values: ["Optional",       "Enforced",            "Enforced + SSO/SAML"] }
        - { label: "SSO / SCIM",               values: ["—",              "Google, Microsoft",   "SAML, OIDC, SCIM provisioning"] }
        - { label: "Role-based access",        values: ["Owner only",     "Roles + scoped keys", "Custom roles + tenant isolation"] }
        - { label: "Audit log retention",      values: ["30 days",        "1 year",              "Per jurisdiction (5–7 years)"] }
        - { label: "Penetration test reports", values: ["—",              "Annual summary",      "Full report under NDA"] }

compliance_badges:
  - { label: "SOC 2 Type II (in progress)" }
  - { label: "ISO 27001 (in progress)" }
  - { label: "ISO 42001 (in progress)" }
  - { label: "GDPR" }
  - { label: "CCPA" }

subprocessors:
  - { name: "Cloudflare",   purpose: "Edge compute, DNS, WAF, R2/D1/KV" }
  - { name: "Stripe",       purpose: "Subscriptions and developer payouts" }
  - { name: "Resend",       purpose: "Transactional email" }
  - { name: "Auth0",        purpose: "Authentication and MFA" }
  - { name: "Sumsub",       purpose: "KYC / KYB verification" }

collections:
  models:
    output: true
    permalink: /models/:slug/
  research:
    output: true
    permalink: /research/:slug/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: models
    values:
      layout: model
  - scope:
      path: ""
      type: research
    values:
      layout: page

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - legacy/
  - infrastructure/
  - node_modules/
  - vendor/
  - Gemfile
  - package.json
  - README.md
  - replit.md
  - "*.md.bak"
  - .github/
  - .agents/
  - .local/
  - .replit
  - .DS_Store
  - wrangler.jsonc
  - wrangler.toml
  - .wrangler/
  - admin-fix-status.md
  - BUG_FIXES_COMPLETED.md
  - IMPLEMENTATION_SUMMARY.md
  - OPTIMIZATION_SUMMARY.md
  - cookies.txt
  - storage/
  - migrations/
  - contracts/
  - attached_assets/
  - .cache/
