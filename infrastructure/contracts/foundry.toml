[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 256 }

# Deploy targets — operator overrides via `--rpc-url $BASE_RPC_URL`
# at deploy time. The defaults match the mainnet contract addresses
# the orchestrator's Worker config points at.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}" }
