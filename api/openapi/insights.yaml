openapi: 3.0.3
info:
  title: GeFi AI insights
  version: 0.1.0
  description: >
    Insight, sentiment and prediction generation with confidence scores; report narratives (Claude API behind a flag; deterministic sample otherwise).
    Skeleton contract (ledger task 300) — paths stubbed, request/response
    schemas land with the owning 300-series task. Envelope conventions
    (auth, pagination, errors, idempotency, SSE) come from _envelope.yaml.
servers:
  - url: /v1
    description: >
      Resolved against site.api.base_url (empty today). The task-301 mock
      server serves this contract locally and stamps X-GeFi-Sample: true.
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: insights
    description: "AI insights"
paths:
  /insights:
    get:
      operationId: get-insights
      summary: "Current insights with confidence + impact"
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /insights/generate:
    post:
      operationId: post-insights-generate
      summary: "Generate insights (flagged: Claude API or deterministic sample)"
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /sentiment:
    get:
      operationId: get-sentiment
      summary: "Market sentiment gauge"
      tags: [insights]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /predictions:
    get:
      operationId: get-predictions
      summary: "Model predictions (e.g. Fed decision probability)"
      tags: [insights]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /narratives:
    post:
      operationId: post-narratives
      summary: "Generate a report narrative for a report id"
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
