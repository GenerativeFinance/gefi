openapi: 3.0.3
info:
  title: GeFi AI insights
  version: 0.2.0
  description: >
    Short, structured insights for the portfolio, market, regulator and
    provider panels, plus sentiment, predictions and report narratives.


    SEEDED BY DEFAULT. The insight sets are deterministic and derived from
    the demonstration dataset; the same surface always shows the same
    insights, live or offline. Every insight carries `generated: false`.


    THE OPTIONAL LIVE GENERATOR. When the server is started with
    GEFI_INSIGHTS_CLAUDE=1 and an ANTHROPIC_API_KEY in its environment,
    POST /insights/generate calls the Claude API (model claude-sonnet-5,
    temperature 0, strict JSON output validated against the insight schema;
    the prompt template lives in backend/mock/prompts/insights.txt). Its
    output is returned with `generated: true` — the label a client MUST
    render so a reader can tell an authored insight from a generated one —
    and ANY failure (no key, network, refusal, malformed output) falls back
    to the seeded set rather than surfacing an error. No key ships in this
    repository.


    NOT ADVICE. Insights describe sample data. They are not research, not a
    recommendation, and not a basis for any investment decision.

servers:
  - url: /v1
    description: >
      Resolved against site.api.base_url (empty today). The task-301 mock
      server serves this contract locally and stamps X-GeFi-Sample: true.
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: insights
    description: "AI insights"
paths:
  /insights:
    get:
      operationId: get-insights
      summary: "Insights"
      description: All surfaces, or one via `surface`.
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
        - name: surface
          in: query
          schema:
            type: string
            enum: [portfolio, market, regulator, provider]
      responses:
        '200':
          description: A page of insights.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_envelope.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Insight'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /insights/{id}:
    get:
      operationId: get-insights-id
      summary: "One insight"
      tags: [insights]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The insight.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '404':
          description: No such insight.
          content:
            application/json:
              schema:
                $ref: '_envelope.yaml#/components/schemas/Error'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /insights/generate:
    post:
      operationId: post-insights-generate
      summary: "Generate insights for a surface"
      description: >
        Returns the surface's insights. Seeded by default; with the live
        generator enabled (see THE OPTIONAL LIVE GENERATOR above) the items
        come back with `generated: true`, and any failure falls back to the
        seeded set. `source` says which path produced the response.
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                surface:
                  type: string
                  enum: [portfolio, market, regulator, provider]
                  default: portfolio
      responses:
        '200':
          description: The insights, labelled by how they were produced.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                type: object
                properties:
                  surface:
                    type: string
                  source:
                    type: string
                    enum: [seeded, claude]
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Insight'
        '422':
          description: Unknown surface.
          content:
            application/json:
              schema:
                $ref: '_envelope.yaml#/components/schemas/Error'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /sentiment:
    get:
      operationId: get-sentiment
      summary: "Market sentiment block"
      tags: [insights]
      responses:
        '200':
          description: The sentiment figures the market panels render.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                type: object
                properties:
                  sentimentPct:
                    type: number
                  sentimentLabel:
                    type: string
                  usd:
                    type: object
                  gdp:
                    type: object
                  fed:
                    type: object
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /predictions:
    get:
      operationId: get-predictions
      summary: "Model predictions"
      description: Sample predictions with stated probabilities. Not forecasts.
      tags: [insights]
      responses:
        '200':
          description: A page of predictions.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '_envelope.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            subject:
                              type: string
                            prediction:
                              type: string
                            probability_pct:
                              type: number
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /narratives:
    post:
      operationId: post-narratives
      summary: "Report narrative"
      description: Deterministic sample narrative for a report id.
      tags: [insights]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
      responses:
        '201':
          description: The narrative.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                  narrative:
                    type: string
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
components:
  schemas:
    Insight:
      type: object
      properties:
        id:
          type: string
        surface:
          type: string
          enum: [portfolio, market, regulator, provider]
        title:
          type: string
        body:
          type: string
        sentiment:
          type: string
        confidence:
          type: number
        impact:
          type: string
        generated:
          type: boolean
          description: >
            True only when the live generator produced it. Clients MUST
            render this label so a reader can tell an authored insight from
            a generated one.
