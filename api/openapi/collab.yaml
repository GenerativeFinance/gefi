openapi: 3.0.3
info:
  title: GeFi Collaboration & bounties
  version: 0.1.0
  description: >
    Teams, invites, discussion threads; bounty lifecycle (claim, submission, review, reward).
    Skeleton contract (ledger task 300) — paths stubbed, request/response
    schemas land with the owning 300-series task. Envelope conventions
    (auth, pagination, errors, idempotency, SSE) come from _envelope.yaml.
servers:
  - url: /v1
    description: >
      Resolved against site.api.base_url (empty today). The task-301 mock
      server serves this contract locally and stamps X-GeFi-Sample: true.
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: collab
    description: "Collaboration & bounties"
paths:
  /teams:
    get:
      operationId: get-teams
      summary: "Teams"
      tags: [collab]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /teams/{id}/invites:
    post:
      operationId: post-teams-id-invites
      summary: "Invite a member"
      tags: [collab]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /threads:
