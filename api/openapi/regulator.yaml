  /regulator/issues/{id}/resolve:
    post:
      operationId: post-regulator-issues-id-resolve
      summary: "Resolve an issue (moves overview counts)"
      tags: [regulator]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
