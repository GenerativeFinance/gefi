openapi: 3.0.3
info:
  title: GeFi Portfolio & risk
  version: 0.1.0
  description: >
    Holdings, valuations, P&L series, returns vs benchmark, risk metrics (Sharpe, drawdown, beta, alpha, volatility, VaR), allocation, watchlist.
    Skeleton contract (ledger task 300) — paths stubbed, request/response
    schemas land with the owning 300-series task. Envelope conventions
    (auth, pagination, errors, idempotency, SSE) come from _envelope.yaml.
servers:
  - url: /v1
    description: >
      Resolved against site.api.base_url (empty today). The task-301 mock
      server serves this contract locally and stamps X-GeFi-Sample: true.
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: portfolio
    description: "Portfolio & risk"
paths:
  /portfolio:
    get:
      operationId: get-portfolio
      summary: "Portfolio summary (value, day/total P&L)"
      tags: [portfolio]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /portfolio/holdings:
    get:
      operationId: get-portfolio-holdings
      summary: "Holdings with weights and returns"
      tags: [portfolio]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /portfolio/transactions:
    get:
      operationId: get-portfolio-transactions
      summary: "Transaction history"
      tags: [portfolio]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /portfolio/performance:
    get:
      operationId: get-portfolio-performance
      summary: "Return series vs benchmark"
      tags: [portfolio]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /portfolio/risk:
    get:
      operationId: get-portfolio-risk
      summary: "Risk metrics: sharpe, max_drawdown, beta, alpha, volatility, var95"
      tags: [portfolio]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /portfolio/allocation:
    get:
      operationId: get-portfolio-allocation
      summary: "Allocation by asset class (sums to 100)"
      tags: [portfolio]
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /watchlist:
    get:
      operationId: get-watchlist
      summary: "Watchlist symbols"
      tags: [portfolio]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/Limit'
        - $ref: '_envelope.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
    post:
      operationId: post-watchlist
      summary: "Add a symbol"
      tags: [portfolio]
      parameters:
        - $ref: '_envelope.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
  /watchlist/{symbol}:
    delete:
      operationId: delete-watchlist-symbol
      summary: "Remove a symbol"
      tags: [portfolio]
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stubbed — schema lands with the owning service task.
          headers:
            X-GeFi-Sample:
              $ref: '_envelope.yaml#/components/headers/XGeFiSample'
        '429':
          $ref: '_envelope.yaml#/components/responses/RateLimited'
        default:
          $ref: '_envelope.yaml#/components/responses/Error'
