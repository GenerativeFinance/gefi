---
layout: default
---
<article class="container narrow post">
  <p class="eyebrow">
    <a href="/blog/">Blog</a> &middot;
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </p>
  <h1>{{ page.title }}</h1>
  {%- if page.lead -%}
    <p class="lead">{{ page.lead }}</p>
  {%- endif -%}
  {%- if page.author -%}
    <p class="byline">By {{ page.author }}</p>
  {%- endif -%}

  <div class="prose">
    {{ content }}
  </div>

  <hr />
  <p>
    <a class="btn btn-ghost" href="/blog/">&larr; Back to all posts</a>
  </p>
</article>
