---
layout: default
---
<article class="container narrow page">
  {%- if page.eyebrow -%}
    <p class="eyebrow">{{ page.eyebrow }}</p>
  {%- endif -%}
  {%- unless page.hide_title -%}
    <h1>{{ page.title }}</h1>
  {%- endunless -%}
  {%- if page.lead -%}
    <p class="lead">{{ page.lead }}</p>
  {%- endif -%}

  <div class="prose">
    {{ content }}
  </div>
</article>
